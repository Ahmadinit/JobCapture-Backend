name: Job Sync Cron & On-Demand Dispatch

on:
  schedule:
    # Run automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual fetch trigger'
        required: false
        default: 'Manual user/admin trigger from dashboard'

jobs:
  harvest-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci || npm install --omit=dev

      - name: Run Job Harvester & Ingestion
        # To run remotely in GitHub Actions, add JOB_CAPTURE_API_URL and SUBMIT_API_KEY in GitHub Repo Settings -> Secrets -> Actions
        run: |
          API_URL="${JOB_CAPTURE_API_URL:-https://job-capture-backend.vercel.app}"
          echo "Triggering job harvester workflow against $API_URL..."
          echo "Reason: ${{ github.event.inputs.reason || 'Scheduled cron' }}"
          # When running in GitHub Actions with repo secrets configured:
          # python scripts/harvester.py
