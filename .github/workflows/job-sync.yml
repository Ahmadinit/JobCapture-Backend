name: Job Sync Cron & On-Demand Dispatch

on:
  schedule:
    # Run automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual fetch trigger'
        required: false
        default: 'Manual user/admin trigger from dashboard'

jobs:
  harvest-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci || npm install --omit=dev

      - name: Run Job Harvester & Ingestion
        env:
          JOB_CAPTURE_API_URL: ${{ secrets.JOB_CAPTURE_API_URL || 'https://job-capture-backend.vercel.app' }}
          SUBMIT_API_KEY: ${{ secrets.SUBMIT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Triggering job harvester workflow..."
          echo "Reason: ${{ github.event.inputs.reason || 'Scheduled cron' }}"
          # When you have your scraper script, it runs here and POSTs raw posts to $JOB_CAPTURE_API_URL/api/jobs/ingest
          # Example: node src/scripts/syncJobs.js
